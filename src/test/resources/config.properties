base.url=https://www.saucedemo.com/
browser=chrome
headless=false
env=QA

page.load.timeout.seconds=30
explicit.wait.seconds=15

retry.count=1
report.dir=test-output/extent-reports

# saucedemo.com applies a flat 8% tax on checkout, rounded to 2 decimals
# (observed: $29.99 item -> $2.40 tax, $39.98 items -> $3.20 tax). Used by
# CheckoutTest to compute expected tax/total from ProductCatalog prices
# instead of hardcoding the expected total for a specific item combination.
checkout.tax.rate=0.08
